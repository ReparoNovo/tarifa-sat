name: Iconos de la app
on:
  push:
    paths: ['tools/iconos.py', '.github/workflows/iconos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  iconos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/iconos.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add icons
          git diff --cached --quiet || (git commit -m "Iconos con el logo de Reparo Novo" && git push)
